<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Signatur-Generator RGZH</title>
<style>
  :root { --blue:#004b91; --bg:#f5f5f0; --field:#e8e6e0; --tint:#e6edf4; }
  * { box-sizing:border-box; }
  body { margin:0; background:var(--bg); color:var(--blue); font-family:"Helvetica Neue",Helvetica,Arial,sans-serif; font-weight:300; line-height:1.25; }
  .page { max-width:75rem; margin:0 auto; padding:0 2rem; }
  header.site { display:flex; align-items:center; gap:1rem; padding:1.5rem 0 0; }
  header.site .lion { height:4.1rem; width:auto; }
  header.site .name { display:flex; align-items:center; gap:.75rem; font-weight:700; font-size:1.25rem; }
  header.site .name img { height:2.5rem; width:auto; }
  header.site .name p { margin:0; }
  .intro { margin:2.5rem 0 2rem; }
  h1 { font-size:2.25rem; font-weight:700; margin:0 0 .5rem; }
  .intro p { margin:0; font-size:1.05rem; }
  main { display:grid; grid-template-columns:340px 1fr; gap:3rem; padding-bottom:4rem; }
  @media (max-width:820px){ main{ grid-template-columns:1fr; gap:2rem; } .page{ padding:0 1rem; } }
  section { background:none; border:0; padding:0; }
  h2 { font-size:1.17rem; font-weight:700; margin:0 0 1rem; text-transform:none; letter-spacing:0; color:var(--blue); }
  label { display:block; font-size:.95rem; font-weight:700; margin-bottom:.9rem; }
  input[type=text], input[type=tel] { display:block; width:100%; margin-top:.25rem; padding:.5em; font:inherit; font-weight:400; color:var(--blue); background:var(--field); border:0; border-radius:0; box-shadow:inset 0 4px 0 -2px var(--blue), inset 0 -4px 0 -2px var(--blue); }
  input[type=text]:focus, input[type=tel]:focus { outline:0; border-radius:4px; box-shadow:0 0 0 2px var(--blue); }
  input[readonly] { opacity:.55; cursor:not-allowed; }
  #preview { font-weight:400; background:#fff; padding:1.5rem; border-radius:8px; overflow:auto; }
  .row { display:flex; gap:.75rem; flex-wrap:wrap; margin-top:1.25rem; }
  button { font:inherit; font-weight:700; padding:.5em 1em; cursor:pointer; color:var(--blue); background:var(--tint); border:2px solid var(--blue); border-radius:0; }
  button:hover, button:active { background:var(--blue); color:var(--tint); }
  button.secondary { background:transparent; }
  button.secondary:hover { background:var(--blue); color:var(--tint); }
  #status { margin-top:.75rem; min-height:1.25em; font-weight:700; }
  ol { padding-left:1.25rem; margin:1.25rem 0 0; font-size:.95rem; }
  ol li { margin-bottom:.25rem; }
</style>
</head>

const $ = id => document.getElementById(id);
const esc = s => s.replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const FIELDS = ['name','role','office','street','city','phone1','phone2','web'];

function build() {
  const v = {};
  FIELDS.forEach(f => v[f] = $(f).value.trim());
  const lines = [];
  const nameLine = v.name ? `<b>${esc(v.name)}</b>` : '';
  if (v.role) lines.push(esc(v.role));
  if (v.office) lines.push(esc(v.office));
  const addr = [];
  if (v.street) addr.push(esc(v.street));
  if (v.city) addr.push(esc(v.city));
  if (v.phone1) addr.push(esc(v.phone1));
  if (v.phone2) addr.push(esc(v.phone2));
  if (v.web) {
    const href = /^https?:\/\//.test(v.web) ? v.web : 'https://' + v.web;
    addr.push(`<a href="${esc(href)}" style="font-family:Arial,Helvetica,sans-serif;font-size:10pt;color:#2e6e80;">${esc(v.web)}</a>`);
  }
  const logo = `<td valign="top" style="padding-left:4px;"><img src="${LOGO}" width="181" alt="RG@Irchel - Ab Sommer 2027 auf dem Campus Irchel"></td>`;
    return `<table cellpadding="0" cellspacing="0" border="0" style="font-family:Arial,Helvetica,sans-serif;font-size:10pt;color:#000;white-space:nowrap;">
<tr>
<td colspan="2" valign="top" nowrap style="white-space:nowrap;font-family:Arial,Helvetica,sans-serif;font-size:10pt;">
<b>Realgymnasium R&auml;mib&uuml;hl Z&uuml;rich</b><br>
Kantonsschule / IB World School<br>
_____________________________<br>
<br>
</td>
</tr>
<tr>
<td colspan="2" valign="top" nowrap style="white-space:nowrap;font-family:Arial,Helvetica,sans-serif;font-size:10pt;">
${[nameLine, ...lines].filter(Boolean).join('<br>\n')}
</td>
</tr>
<tr>
<td valign="top" nowrap width="110" style="white-space:nowrap;font-family:Arial,Helvetica,sans-serif;font-size:10pt;padding-right:0;width:110px;">
<br>
${addr.join('<br>\n')}
</td>
${logo}
</tr>
</table>`;
}

function render() { $('preview').innerHTML = build(); }
FIELDS.forEach(f => $(f).addEventListener('input', render));
render();

function say(msg) { $('status').textContent = msg; }

$('copy').addEventListener('click', async () => {
  const html = build();
  try {
    await navigator.clipboard.write([new ClipboardItem({
      'text/html': new Blob([html], {type:'text/html'}),
      'text/plain': new Blob([$('preview').innerText], {type:'text/plain'})
    })]);
    say('Kopiert. Jetzt in Outlook einfügen (Strg+V).');
  } catch (e) {
    const range = document.createRange();
    range.selectNodeContents($('preview'));
    const sel = getSelection(); sel.removeAllRanges(); sel.addRange(range);
    const ok = document.execCommand('copy');
    sel.removeAllRanges();
    say(ok ? 'Kopiert. Jetzt in Outlook einfügen (Strg+V).' : 'Kopieren fehlgeschlagen: Vorschau markieren und Strg+C drücken.');
  }
});

$('download').addEventListener('click', () => {
  const doc = '<!DOCTYPE html><html><head><meta charset="utf-8"><title>Signatur</title></head><body>' + build() + '</body></html>';
  const a = document.createElement('a');
  a.href = URL.createObjectURL(new Blob([doc], {type:'text/html'}));
  a.download = 'signatur.html';
  a.click();
  URL.revokeObjectURL(a.href);
});
</script>
</body>
</html>
